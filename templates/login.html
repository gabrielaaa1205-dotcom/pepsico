<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso | Cianse Kardex</title><style>body{font:16px system-ui;background:#edf4f1;display:grid;place-items:center;min-height:95vh}main{background:white;padding:28px;max-width:380px;width:85%;border-radius:16px;box-shadow:0 6px 25px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #cbd5d1}button{background:#146446;color:white;border:0;cursor:pointer}.err{color:#a22}</style><main><h2>CIANSE · Kardex</h2><p>Accede con tu cuenta del sistema.</p>{% if error %}<p class="err">{{ error }}</p>{% endif %}<form method="post"><label>Usuario<input name="username" autocomplete="username" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form></main></html>
