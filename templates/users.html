<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios Cianse</title><style>body{font:15px system-ui;margin:30px auto;max-width:900px;padding:10px;background:#f6f8f7}section{background:white;padding:20px;border-radius:10px;margin:12px 0}input,select,button{padding:10px;margin:5px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}</style><a href="/">← Volver al Kardex</a><h1>Administrar usuarios</h1>{% if error %}<p style="color:#a22">{{error}}</p>{% endif %}{% if success %}<p>{{success}}</p>{% endif %}<section><h2>Nuevo usuario</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><input name="username" placeholder="Usuario" required><input name="password" type="password" minlength="12" placeholder="Clave (mín. 12 caracteres)" required><select name="role"><option value="operario">Operario</option><option value="supervisor">Supervisor</option><option value="consulta">Solo consulta</option><option value="admin">Administrador</option></select><button>Crear cuenta</button></form></section><section><h2>Cuentas</h2><table><tr><th>Usuario</th><th>Rol</th><th>Cambiar clave</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td><form action="/admin/users/{{u.id}}/password" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><input type="password" name="password" minlength="12" required placeholder="Nueva clave"><button>Cambiar</button></form></td></tr>{% endfor %}</table></section></html>
