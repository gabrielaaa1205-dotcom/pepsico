name: CIANSE - Importar kardex desde DreamHost

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  group: cianse-backup-and-mail-import
  cancel-in-progress: false

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar claves necesarias
        env:
          DATABASE_URL: ${{ secrets.CIANSE_EXTERNAL_DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.CIANSE_BACKUP_PASSWORD }}
          MAIL_PASSWORD: ${{ secrets.CIANSE_MAIL_PASSWORD }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Falta CIANSE_EXTERNAL_DATABASE_URL'; exit 1; }
          test ${#BACKUP_PASSWORD} -ge 20 || { echo 'Falta CIANSE_BACKUP_PASSWORD o no alcanza 20 caracteres'; exit 1; }
          test -n "$MAIL_PASSWORD" || { echo 'Falta CIANSE_MAIL_PASSWORD'; exit 1; }

      - name: Crear respaldo PostgreSQL con pg_dump
        env:
          DATABASE_URL: ${{ secrets.CIANSE_EXTERNAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cianse-backup"
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) ;;
            *) echo 'CIANSE_EXTERNAL_DATABASE_URL no tiene formato de URL PostgreSQL'; exit 1 ;;
          esac
          docker run --rm -e DATABASE_URL="$DATABASE_URL" \
            -v "$RUNNER_TEMP/cianse-backup:/backup" \
            postgres:18 \
            bash -c 'test -n "$DATABASE_URL" || { echo "No se recibió DATABASE_URL dentro del contenedor"; exit 1; }; pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/cianse.dump'
          test -s "$RUNNER_TEMP/cianse-backup/cianse.dump"

      - name: Cifrar respaldo
        env:
          BACKUP_PASSWORD: ${{ secrets.CIANSE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/cianse-backup/cianse.dump" \
            -out "$RUNNER_TEMP/cianse-backup/cianse.dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm -f "$RUNNER_TEMP/cianse-backup/cianse.dump"
          test -s "$RUNNER_TEMP/cianse-backup/cianse.dump.enc"

      - name: Guardar respaldo cifrado
        uses: actions/upload-artifact@v4
        with:
          name: cianse-respaldo-previo-${{ github.run_number }}
          path: ${{ runner.temp }}/cianse-backup/cianse.dump.enc
          retention-days: 7
          if-no-files-found: error

  importar:
    needs: respaldo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Sincronizar kardex desde DreamHost
        env:
          DATABASE_URL: ${{ secrets.CIANSE_EXTERNAL_DATABASE_URL }}
          MAIL_USERNAME: jesus.gutierrez@cianse.com
          MAIL_PASSWORD: ${{ secrets.CIANSE_MAIL_PASSWORD }}
          MAIL_IMAP_HOST: imap.dreamhost.com
          MAIL_IMAP_PORT: '993'
          MAIL_ALLOWED_SENDER: laura.guzman@cianse.net
          MAIL_LOOKBACK_DAYS: '14'
        run: python mail_sync.py
