name: CIANSE - Respaldo PostgreSQL cifrado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar secretos
        env:
          DATABASE_URL: ${{ secrets.CIANSE_EXTERNAL_DATABASE_URL }}
          BACKUP_PASSWORD: ${{ secrets.CIANSE_BACKUP_PASSWORD }}
        run: |
          test -n "$DATABASE_URL" || { echo 'Falta CIANSE_EXTERNAL_DATABASE_URL'; exit 1; }
          test ${#BACKUP_PASSWORD} -ge 20 || { echo 'CIANSE_BACKUP_PASSWORD debe tener al menos 20 caracteres'; exit 1; }

      - name: Exportar PostgreSQL 18
        env:
          DATABASE_URL: ${{ secrets.CIANSE_EXTERNAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cianse-backup"
          docker run --rm \
            --env DATABASE_URL \
            -v "$RUNNER_TEMP/cianse-backup:/backup" \
            postgres:18 \
            bash -c 'test -n "$DATABASE_URL" || { echo "No se recibió DATABASE_URL dentro del contenedor"; exit 1; }; pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/cianse.dump'
          test -s "$RUNNER_TEMP/cianse-backup/cianse.dump"

      - name: Cifrar y borrar original
        env:
          BACKUP_PASSWORD: ${{ secrets.CIANSE_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/cianse-backup/cianse.dump" \
            -out "$RUNNER_TEMP/cianse-backup/cianse.dump.enc" \
            -pass env:BACKUP_PASSWORD
          rm -f "$RUNNER_TEMP/cianse-backup/cianse.dump"
          test -s "$RUNNER_TEMP/cianse-backup/cianse.dump.enc"

      - name: Guardar respaldo cifrado durante 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: cianse-postgresql-cifrado-${{ github.run_number }}
          path: ${{ runner.temp }}/cianse-backup/cianse.dump.enc
          retention-days: 7
          if-no-files-found: error
